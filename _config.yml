# Site settings
title: Meisen Gao Group
first_name: Meisen
last_name: Gao
email: msgao@ecust.edu.cn
description: > # this means to ignore newlines until next field
  Meisen Gao Group at East China University of Science and Technology.
  High-energy physics phenomenology, jets, QCD, and AI applications.

url: https://masongao.github.io
baseurl: # leave blank for user pages

# Language and timezone
lang: en
timezone: Asia/Shanghai

# Social links
github_username: MasonGao
scholar_userid: # your Google Scholar ID
orcid_id: # your ORCID ID

# News settings
news_limit: 5

# Jekyll settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false

# Includes & Excludes
include: ['_pages']
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

# Plugins (minimal for fast loading)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Optimization
sass:
  style: compressed

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
